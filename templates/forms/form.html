{# Every {{ form }} renders through this (see core/forms.py). #}
{% if errors %}
  <div class="form-errors" role="alert">{% for error in errors %}<p>{{ error }}</p>{% endfor %}</div>
{% endif %}
{% for field, errors in fields %}{{ field.as_field_group }}{% endfor %}
{% for field in hidden_fields %}{{ field }}{% endfor %}
