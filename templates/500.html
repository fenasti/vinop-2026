<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Something went wrong | VinOp</title>
  <style>
    /* Self-contained on purpose: when the server fails, the database and
       settings may be unavailable, so this page needs nothing from them. */
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
           background: #EDF0EE; color: #17222B; font: 1rem/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 32rem; text-align: center; }
    h1 { font-family: "Palatino Linotype", Palatino, Georgia, serif; font-weight: 600; font-size: 2rem; margin: 0 0 .75rem; }
    a { display: inline-block; margin-top: 1rem; padding: .7em 1.2em; border-radius: 6px; background: #6E1E3A; color: #fff; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>Something went wrong on our side</h1>
    <p>The error has been logged. Please try again in a minute. If you were paying, your card will only be charged once; check your inbox for a confirmation before trying again.</p>
    <a href="/">Back to the shop</a>
  </main>
</body>
</html>
